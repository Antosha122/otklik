<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1f6">
<title>Отклик — личный кабинет</title>
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/layout.css">
<link rel="stylesheet" href="/assets/css/responsive.css">
</head>
<body data-page="profile" data-ui-mode="__OTKLIK_UI_MODE__">
<script src="/assets/js/boot.js"></script>
<header>
  <div class="top">
    <h1>Отклик</h1>
    <div class="who" id="whoami">анонимно</div>
  </div>
</header>
<main>
<section id="secStaff">
  <div class="card" id="stHome">
    <div class="panel-head">
      <h2>Личный кабинет</h2>
      <div class="btnrow">
        <a class="ghost small" id="navHomeLink" href="/operator">К панели</a>
        <button class="ghost small" data-action="staff-change-password">Сменить пароль</button>
        <button class="ghost small" data-action="staff-logout">Выйти</button>
      </div>
    </div>

    <div class="panel-head">
      <h3>Профиль</h3>
      <button class="ghost small" data-action="reload-profile">Обновить</button>
    </div>
    <div id="prInfo" class="note"></div>

    <div id="prWorkloadCard" class="hidden">
      <hr class="divider">
      <div class="panel-head"><h3>Моя нагрузка</h3></div>
      <div id="prWorkload" class="note"></div>
    </div>

    <div id="prStatsCard" class="hidden">
      <hr class="divider">
      <div class="panel-head"><h3>Моя аналитика</h3></div>
      <div id="prStats" class="note"></div>
    </div>

    <hr class="divider">
    <div class="panel-head"><h3>Последние действия</h3></div>
    <div id="prEvents" class="note"></div>

    <hr class="divider">
    <div id="prTotpCard" class="hidden">
      <div class="panel-head">
        <h3>Двухфакторная аутентификация (2FA)</h3>
        <button class="ghost small" data-action="totp-refresh">Обновить</button>
      </div>
      <div id="prTotp" class="note"></div>
    </div>

    <hr class="divider">
    <div class="panel-head">
      <h3>Выгрузка обращений (CSV)</h3>
      <button class="ghost small" data-action="export-csv">Скачать CSV</button>
    </div>
    <div class="filters">
      <div class="f"><label for="exFrom">Период с</label><input type="date" id="exFrom"></div>
      <div class="f"><label for="exTo">по</label><input type="date" id="exTo"></div>
      <div class="f">
        <label for="exStatus">Статус</label>
        <select id="exStatus">
          <option value="">любой статус</option>
          <option value="new">новое</option>
          <option value="assigned">назначено</option>
          <option value="in_progress">в работе</option>
          <option value="needs_clarification">нужны уточнения</option>
          <option value="answer_ready">готов ответ</option>
          <option value="returned">возвращено</option>
          <option value="completed">завершено</option>
          <option value="rejected">отклонено</option>
          <option value="closed_no_response">закрыто без ответа</option>
        </select>
      </div>
      <div class="f">
        <label for="exPriority">Приоритет</label>
        <select id="exPriority">
          <option value="">любой</option>
          <option value="low">низкий</option>
          <option value="normal">обычный</option>
          <option value="urgent">срочный</option>
        </select>
      </div>
      <div class="f">
        <label for="exGroup">Специальность</label>
        <select id="exGroup">
          <option value="">любая</option>
          <option value="psychologists">психолог</option>
          <option value="conflictologists">конфликтолог</option>
          <option value="lawyers">юрист</option>
          <option value="social_pedagogues">социальный педагог</option>
          <option value="free">свободная форма</option>
        </select>
      </div>
      <div class="f">
        <label for="exCrisis">Кризисные</label>
        <select id="exCrisis">
          <option value="">все</option>
          <option value="yes">только кризисные</option>
          <option value="no">без кризисных</option>
        </select>
      </div>
    </div>
    <div class="note" id="exScope"></div>
  </div>
</section>
</main>
<script type="module" src="/assets/js/main.js"></script>
</body>
</html>
