<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1f6">
<title>Отклик — панель оператора</title>
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/layout.css">
<link rel="stylesheet" href="/assets/css/responsive.css">
</head>
<body data-page="operator" data-ui-mode="__OTKLIK_UI_MODE__">
<script src="/assets/js/boot.js"></script>
<header>
  <div class="top">
    <h1>Отклик</h1>
    <div class="who" id="whoami">анонимно</div>
  </div>
</header>
<main>
<section id="secStaff">
  <div class="card" id="stHome">
    <div class="panel-head">
      <h2 id="stHello"></h2>
      <div class="btnrow">
        <a class="ghost small hidden" id="navAdminLink" href="/admin">Администрирование</a>
        <button class="ghost small" data-action="staff-change-password">Сменить пароль</button>
        <button class="ghost small" data-action="staff-logout">Выйти</button>
      </div>
    </div>

    <div id="opPanel">
      <div class="panel-head">
        <h3>Очередь новых <span id="opQueueOverdue" class="overdue-counter hidden"></span></h3>
        <button class="ghost small" data-action="reload-queue">Обновить</button>
      </div>
      <div id="opQueue"></div>
      <hr class="divider">
      <div class="panel-head">
        <h3>Все обращения</h3>
        <div class="filter-line">
          <label>Фильтр по статусу</label>
          <select id="opFilterStatus">
            <option value="active">активные</option>
            <option value="distributed">распределённые (контроль)</option>
            <option value="">любой статус</option>
            <option value="new">новое</option><option value="assigned">назначено</option>
            <option value="in_progress">в работе</option><option value="needs_clarification">нужны уточнения</option>
            <option value="answer_ready">готов ответ</option><option value="returned">возвращено</option>
            <option value="completed">завершено</option><option value="rejected">отклонено</option>
            <option value="closed_no_response">закрыто без ответа</option>
          </select>
          <button class="ghost small" data-action="reload-op-all">Обновить</button>
        </div>
      </div>
      <div id="opAll"></div>
      <hr class="divider">
      <div class="panel-head">
        <h3>Моя аналитика</h3>
        <button class="ghost small" data-action="reload-my-stats">Обновить</button>
      </div>
      <div id="opMyStats" class="note"></div>
      <div class="form-foot"><button class="ghost small" data-action="export-csv">Выгрузить CSV (все обращения)</button></div>
      <hr class="divider">
      <div class="panel-head">
        <h3>Жалобы заявителей</h3>
        <button class="ghost small" data-action="reload-op-complaints">Обновить</button>
      </div>
      <div class="note">Жалобы на специалистов видит только оператор и админ — эксперты доступа не имеют.</div>
      <div id="opComplaints" class="note"></div>
    </div>
  </div>
</section>
</main>
<script type="module" src="/assets/js/main.js"></script>
</body>
</html>
