services:
  db:
    image: postgres:16-alpine
    container_name: otklik-db
    environment:
      POSTGRES_USER: otklik
      # Пароль берётся из .env (см. .env.example); в репозитории не хранится.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}"
      POSTGRES_DB: otklik
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Только loopback: порт нужен лишь для локальных интеграционных тестов,
      # наружу (интернет) БД не торчит.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otklik -d otklik"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: otklik-app
    environment:
      LISTEN_ADDR: ":8080"
      STAFF_LISTEN_ADDR: ":8081"
      DATABASE_URL: "postgres://otklik:${POSTGRES_PASSWORD}@db:5432/otklik?sslmode=disable"
      ATTACHMENTS_DIR: "/app/data/attachments"
      SESSION_TTL_MIN: "120"
      # Пароль демо-пользователей. Явного дефолта нет: если не задан в .env,
      # приложение генерирует случайный и печатает его в лог один раз.
      SEED_DEFAULT_PWD: "${SEED_DEFAULT_PWD:-}"
      # 1 = куки только по HTTPS (прод за Caddy); локальная разработка — 0 в .env.
      COOKIE_SECURE: "${COOKIE_SECURE:-1}"
      # Срок хранения завершённых обращений (дней); 0 — хранить бессрочно.
      # Персональные данные детей не должны копиться вечно.
      RETENTION_DAYS: "${RETENTION_DAYS:-730}"
      # Формат логов: json — для прода (собирает Docker), text — локальная отладка.
      LOG_FORMAT: "${LOG_FORMAT:-json}"
    ports:
      # Прямой доступ только с localhost; наружу всё идёт через caddy (TLS).
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    volumes:
      - appdata:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # busybox-wget есть в alpine-образе; проверяем оба порта приложения.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health && wget -q -O /dev/null http://127.0.0.1:8081/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Ночные бэкапы БД: pg_dump в кастомном формате (-Fc — сжатие и выборочное
  # восстановление), затем шифрование AES-256-CBC (openssl; ключ — BACKUP_KEY
  # из .env, в файловой системе ключ не лежит). Ротация последних N копий
  # (BACKUP_KEEP, по умолчанию 14). Первый бэкап делается сразу при старте
  # контейнера — удобно проверять.
  # Образ debian (не alpine): в alpine нет openssl.
  # Восстановление:
  #   openssl enc -d -aes-256-cbc -pbkdf2 -in otklik-<ts>.dump.enc -pass env:BACKUP_KEY \
  #     | docker compose exec -T db pg_restore -U otklik -d otklik --clean
  db-backup:
    image: postgres:16
    container_name: otklik-db-backup
    environment:
      PGUSER: otklik
      PGPASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}"
      PGHOST: db
      PGDATABASE: otklik
      BACKUP_KEEP: "${BACKUP_KEEP:-14}"
      BACKUP_KEY: "${BACKUP_KEY:?set BACKUP_KEY in .env (see .env.example)}"
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -eu
        while true; do
          ts=$$(date +%Y%m%d-%H%M%S)
          pg_dump -Fc -f "/tmp/otklik-$$ts.dump"
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "/tmp/otklik-$$ts.dump" \
            -out "/backups/otklik-$$ts.dump.enc" -pass env:BACKUP_KEY
          rm -f "/tmp/otklik-$$ts.dump"
          echo "backup saved: otklik-$$ts.dump.enc"
          ls -1t /backups/otklik-*.dump.enc | tail -n +$$(($$BACKUP_KEEP + 1)) | xargs -r rm -f
          sleep 86400
        done
    restart: unless-stopped

  # TLS-терминация: PUBLIC_SITE -> app:8080 (заявители), STAFF_SITE -> app:8081 (сотрудники).
  # Сайты задаются в .env (см. .env.example); домены — Let's Encrypt, IP — самоподписанный сертификат.
  caddy:
    image: caddy:2-alpine
    container_name: otklik-caddy
    environment:
      PUBLIC_SITE: "${PUBLIC_SITE:-localhost}"
      STAFF_SITE: "${STAFF_SITE:-localhost:8443}"
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  backups:
  appdata:
  caddy_data:
  caddy_config:
