# Ротация логов: без лимита json-file-логи растут бесконечно и забивают диск.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    container_name: otklik-db
    environment:
      POSTGRES_USER: otklik
      # Пароль берётся из .env (см. .env.example); в репозитории не хранится.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}"
      POSTGRES_DB: otklik
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Только loopback: порт нужен лишь для локальных интеграционных тестов,
      # наружу (интернет) БД не торчит.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otklik -d otklik"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  app:
    build:
      context: .
      # Версия уходит в /api/health и в версию кэша service worker (PWA):
      # собирайте с OTKLIK_VERSION=$(git rev-parse --short HEAD) docker compose build app
      args:
        OTKLIK_VERSION: "${OTKLIK_VERSION:-dev}"
    container_name: otklik-app
    environment:
      LISTEN_ADDR: ":8080"
      STAFF_LISTEN_ADDR: ":8081"
      DATABASE_URL: "postgres://otklik:${POSTGRES_PASSWORD}@db:5432/otklik?sslmode=disable"
      ATTACHMENTS_DIR: "/app/data/attachments"
      SESSION_TTL_MIN: "120"
      # Пароль демо-пользователей. Явного дефолта нет: если не задан в .env,
      # приложение генерирует случайный и печатает его в лог один раз.
      SEED_DEFAULT_PWD: "${SEED_DEFAULT_PWD:-}"
      # 1 = куки только по HTTPS (прод за Caddy); локальная разработка — 0 в .env.
      COOKIE_SECURE: "${COOKIE_SECURE:-1}"
      # Срок хранения завершённых обращений (дней); 0 — хранить бессрочно.
      # Персональные данные детей не должны копиться вечно.
      RETENTION_DAYS: "${RETENTION_DAYS:-730}"
      # Формат логов: json — для прода (собирает Docker), text — локальная отладка.
      LOG_FORMAT: "${LOG_FORMAT:-json}"
      # 2FA (TOTP) для сотрудников: 0 — выключена (по умолчанию, вход только по
      # паролю), в проде рекомендуется 1 — настройка в личном кабинете /profile.
      TOTP_ENABLED: "${TOTP_ENABLED:-0}"
      # Ключ HMAC для хешей трек-номеров: без него хеши — несолёный SHA-256,
      # и при утечке БД номера можно перебрать офлайн. ВАЖНО: после запуска
      # ключ не менять — обращения, созданные со старым ключом, потеряют вход.
      TRACK_HMAC_KEY: "${TRACK_HMAC_KEY:-}"
      # Web Push: пара VAPID-ключей из одной генерации (go run ./cmd/vapidkeygen).
      # Пустые — уведомления работают только в открытой вкладке (Notification API).
      # ВАЖНО: после включения пару не менять — смена отзывает подписки браузеров.
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      # Контакт администратора для push-провайдеров (mailto:, опционально).
      PUSH_SUBJECT: "${PUSH_SUBJECT:-}"
    ports:
      # Прямой доступ только с localhost; наружу всё идёт через caddy (TLS).
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    volumes:
      - appdata:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # busybox-wget есть в alpine-образе; проверяем оба порта приложения.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health && wget -q -O /dev/null http://127.0.0.1:8081/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    # Бюджет graceful shutdown приложения — до 25 с (10 с серверы + до 15 с
    # джанистор доканчивает удаление по ретеншну). Дефолтные 10 с Docker
    # обрезали бы его посередине: stop_grace_period даёт докончить.
    stop_grace_period: 30s
    logging: *default-logging

  # Ночные бэкапы БД: pg_dump в кастомном формате (-Fc — сжатие и выборочное
  # восстановление), затем шифрование AES-256-CBC (openssl; ключ — BACKUP_KEY
  # из .env, в файловой системе ключ не лежит). Ротация последних N копий
  # (BACKUP_KEEP, по умолчанию 14). Первый бэкап делается сразу при старте
  # контейнера — удобно проверять.
  # Образ debian (не alpine): в alpine нет openssl.
  # Восстановление:
  #   openssl enc -d -aes-256-cbc -pbkdf2 -in otklik-<ts>.dump.enc -pass env:BACKUP_KEY \
  #     | docker compose exec -T db pg_restore -U otklik -d otklik --clean
  db-backup:
    image: postgres:16
    container_name: otklik-db-backup
    environment:
      PGUSER: otklik
      PGPASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}"
      PGHOST: db
      PGDATABASE: otklik
      BACKUP_KEEP: "${BACKUP_KEEP:-14}"
      BACKUP_KEY: "${BACKUP_KEY:?set BACKUP_KEY in .env (see .env.example)}"
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -eu
        while true; do
          ts=$$(date +%Y%m%d-%H%M%S)
          pg_dump -Fc -f "/tmp/otklik-$$ts.dump"
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "/tmp/otklik-$$ts.dump" \
            -out "/backups/otklik-$$ts.dump.enc" -pass env:BACKUP_KEY
          rm -f "/tmp/otklik-$$ts.dump"
          echo "backup saved: otklik-$$ts.dump.enc"
          ls -1t /backups/otklik-*.dump.enc | tail -n +$$(($$BACKUP_KEEP + 1)) | xargs -r rm -f
          sleep 86400
        done
    # Бэкап делается раз в сутки; freshness-проверка: последний .enc не старше
    # 25 часов (1500 минут). Если pg_dump молча умирает и контейнер просто
    # перезапускается, файл перестаёт обновляться — и это становится видно
    # в docker ps (unhealthy) вместо тихого отсутствия бэкапов.
    healthcheck:
      test: ["CMD-SHELL", "find /backups -name 'otklik-*.dump.enc' -mmin -1500 | grep -q ."]
      interval: 30m
      timeout: 10s
      retries: 2
      start_period: 3m
    restart: unless-stopped
    logging: *default-logging

  # Внехостовая копия бэкапов (S3/облако/SFTP — куда умеет rclone). Один бэкап
  # на самом сервере не спасает от потери диска/хостинга. Профиль offsite —
  # сервис не стартует в обычном `docker compose up -d`.
  # Включение (один раз, на сервере):
  #   1) положите ./rclone.conf с настроенным удалённым хранилищем
  #      (например, `rclone config create offsite s3 ...`);
  #   2) BACKUP_OFFSITE_REMOTE=offsite:otklik-backups в .env;
  #   3) docker compose --profile offsite up -d.
  backup-offsite:
    image: rclone/rclone:1.67
    container_name: otklik-backup-offsite
    profiles: ["offsite"]
    environment:
      # Пустое по умолчанию: обычный `docker compose up -d` не должен падать
      # из-за не настроенного (опционального) сервиса. Если сервис включён
      # профилем offsite, а переменная пуста — скрипт ниже завершится с ошибкой.
      BACKUP_OFFSITE_REMOTE: "${BACKUP_OFFSITE_REMOTE:-}"
    volumes:
      - backups:/backups:ro
      - ./rclone.conf:/config/rclone/rclone.conf:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ -z "$$BACKUP_OFFSITE_REMOTE" ]; then
          echo "BACKUP_OFFSITE_REMOTE not set (see .env.example)"; exit 1
        fi
        while true; do
          echo "offsite: copying backups to $$BACKUP_OFFSITE_REMOTE"
          rclone copy /backups "$$BACKUP_OFFSITE_REMOTE" --transfers 4
          touch /tmp/offsite-ok
          sleep 86400
        done
    # Freshness-проверка: маркер успешной копии не старше 25 часов. Если rclone
    # молча падает (напр., кончилось место в облаке), это видно в docker ps.
    healthcheck:
      test: ["CMD-SHELL", "find /tmp -maxdepth 1 -name offsite-ok -mmin -1500 | grep -q ."]
      interval: 30m
      timeout: 10s
      retries: 2
      start_period: 5m
    restart: unless-stopped
    logging: *default-logging

  # TLS-терминация: PUBLIC_SITE -> app:8080 (заявители), STAFF_SITE -> app:8081 (сотрудники).
  # Сайты задаются в .env (см. .env.example); домены — Let's Encrypt, IP — самоподписанный сертификат.
  caddy:
    image: caddy:2-alpine
    container_name: otklik-caddy
    environment:
      PUBLIC_SITE: "${PUBLIC_SITE:-localhost}"
      STAFF_SITE: "${STAFF_SITE:-localhost:8443}"
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

volumes:
  pgdata:
  backups:
  appdata:
  caddy_data:
  caddy_config:
